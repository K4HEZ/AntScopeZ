name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.ui'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-build.yml'

jobs:
  # x86_64 only -- matches the local windows-mingw preset's kit (Qt 6.11.2
  # MinGW 13.1.0). Qt6 already floors at Windows 10, so no deployment-target
  # tuning is needed the way macOS needed one.
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PyPI's released aqtinstall (3.3.0, what install-qt-action would
      # normally pip-install) has a genuine bug for Windows + Qt 6.11.x
      # specifically: it constructs a doubled repo path
      # (.../qt6_6112/qt6_6112/Updates.xml, 404s) and fails outright.
      # Confirmed fixed on aqtinstall's git main (3.3.1.dev166) but not yet
      # released to PyPI, so install-qt-action's aqtversion pin (PyPI-only)
      # can't reach the fix -- installing aqt straight from git instead.
      - name: Install Qt (aqtinstall from git main -- see comment above)
        run: |
          pip install "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git"
          aqt install-qt windows desktop 6.11.2 win64_mingw --outputdir "${{ github.workspace }}\Qt" --modules qtserialport qtconnectivity
          aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir "${{ github.workspace }}\Qt"

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="${{ github.workspace }}\Qt\Tools\mingw1310_64\bin\gcc.exe"
          -DCMAKE_CXX_COMPILER="${{ github.workspace }}\Qt\Tools\mingw1310_64\bin\g++.exe"
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\Qt\6.11.2\mingw_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage install (for smoke test, separate from the installer below)
        run: cmake --install build --prefix "${{ github.workspace }}\stage"

      # Confirms the exe actually launches, not just that it linked.
      - name: Launch and screenshot
        run: |
          Start-Process "${{ github.workspace }}\stage\bin\AntScopeZ.exe"
          Start-Sleep -Seconds 5
          $p = Get-Process AntScopeZ -ErrorAction SilentlyContinue
          if (-not $p) { Write-Error "AntScopeZ did not launch"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("windows-screenshot.png")
          Stop-Process -Name AntScopeZ -Force

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: windows-screenshot.png

      - name: Package installer
        working-directory: build
        run: cpack -G NSIS

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AntScopeZ-windows
          path: build/AntScopeZ-*-win64.exe
