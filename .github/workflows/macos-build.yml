name: macOS build

# Manual only (Actions tab or `gh workflow run <file> --ref develop`):
# develop gets many small pushes and a build isn't wanted for each.
on:
  workflow_dispatch:

jobs:
  # Builds a single universal (arm64 + x86_64) .app/.dmg on one Apple Silicon
  # runner -- Qt's own macOS package is already a universal binary (verified
  # against the actual 6.11.1 QtCore via `file`), so no separate per-arch
  # build/lipo step is needed. Unsigned/not notarized: no Apple Developer
  # account. Users will need to right-click > Open, or `xattr -cr`, past
  # Gatekeeper on first launch.
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          # SerialPort and Bluetooth (analyzer/devinfo components this
          # project's find_package(Qt6 ... COMPONENTS) requires) are addon
          # modules, not part of the base clang_64 essentials package.
          modules: 'qtserialport qtconnectivity'
          cache: true

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_PREFIX_PATH=${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build build -j8

      - name: Stage install (for smoke test, separate from the dmg below)
        run: cmake --install build --prefix "${{ github.workspace }}/stage"

      # Settings::programDataPath() reads these from next to the binary
      # (issue #60); a launch alone wouldn't notice them missing.
      - name: Check shipped data files are in the bundle
        run: |
          for f in cables.txt itu-regions-defaults.txt user-guide.md; do
            test -f "${{ github.workspace }}/stage/AntScopeZ.app/Contents/MacOS/$f" || { echo "missing $f"; exit 1; }
          done

      # Confirms the arm64 slice actually launches, not just that it linked.
      - name: Launch and screenshot (arm64 host)
        run: |
          open "${{ github.workspace }}/stage/AntScopeZ.app"
          sleep 5
          pgrep -x AntScopeZ || { echo "AntScopeZ did not launch"; exit 1; }
          screencapture -x macos-arm64-screenshot.png
          pkill -x AntScopeZ || true

      - name: Upload screenshot (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-screenshot
          path: macos-arm64-screenshot.png

      - name: Package dmg
        working-directory: build
        run: cpack -G DragNDrop

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: AntScopeZ-macos
          path: build/*.dmg

  # Universal binaries compile on any host, but the x86_64 slice only ever
  # actually *executes* on an Intel host -- this job downloads the dmg the
  # build job already produced and launches it on a real Intel (macos-15-intel)
  # runner to confirm that slice works too, rather than rebuilding anything.
  # NOTE: macos-13 (the previous Intel label) was fully retired by GitHub --
  # a run pinned to it queues forever with no error, never gets picked up.
  # macos-15-large looks like the Intel option too but is the paid "larger
  # runner" alias (always billed, even on public repos) -- macos-15-intel is
  # the free standard one; confirmed via GitHub's own runner docs after
  # macos-15-large failed instantly with a billing/spending-limit error.
  intel-smoketest:
    needs: build
    runs-on: macos-15-intel

    steps:
      - name: Download dmg
        uses: actions/download-artifact@v4
        with:
          name: AntScopeZ-macos

      - name: Mount, launch, and screenshot (x86_64 host)
        run: |
          hdiutil attach ./*.dmg -mountpoint /Volumes/AntScopeZ -nobrowse
          open /Volumes/AntScopeZ/AntScopeZ.app
          sleep 5
          pgrep -x AntScopeZ || { echo "AntScopeZ did not launch"; exit 1; }
          screencapture -x macos-x86_64-screenshot.png
          pkill -x AntScopeZ || true
          hdiutil detach /Volumes/AntScopeZ

      - name: Upload screenshot (x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-screenshot
          path: macos-x86_64-screenshot.png
